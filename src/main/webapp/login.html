<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Authentication</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f0f0f0;">
	<div style="width: 300px; margin: 100px auto; padding: 20px; background-color: white; border: 1px solid #ccc; border-radius: 8px;">
		<h2 style="text-align: center;">Login</h2>
		<form action="UserWeb" method="get">
			<div style="margin-bottom: 10px;">
				<label>Username</label> 
				<input type="text" name="userName" required />
			</div>
			<div style="margin-bottom: 15px;">
				<label>Password</label> 
				<input type="password" name="password" required />
			</div>
			<button type="submit" style="width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px;">Login</button>
		</form>
	</div>
</body>
</html>
